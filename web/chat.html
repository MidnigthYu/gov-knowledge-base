<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政务知识库问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 16px 24px;
            background: #fff;
            border-bottom: 1px solid #e4e7ed;
            font-size: 18px;
            font-weight: 600;
            color: #303133;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .message {
            margin-bottom: 20px;
            display: flex;
        }
        .message.user { justify-content: flex-end; }
        .message.ai { justify-content: flex-start; }
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.user .bubble {
            background: #409eff;
            color: #fff;
        }
        .message.ai .bubble {
            background: #fff;
            color: #303133;
            border: 1px solid #e4e7ed;
        }
        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #dcdfe6;
            font-size: 13px;
            color: #606266;
        }
        .source-item {
            margin-bottom: 8px;
            padding: 8px;
            background: #f5f7fa;
            border-radius: 4px;
        }
        .source-score {
            font-size: 12px;
            color: #909399;
            margin-top: 4px;
        }
        .input-area {
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #e4e7ed;
            display: flex;
            gap: 12px;
        }
        #questionInput {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        #questionInput:focus { border-color: #409eff; }
        #sendBtn {
            padding: 0 20px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #sendBtn:disabled {
            background: #a0cfff;
            cursor: not-allowed;
        }
        .clear-btn {
            padding: 0 16px;
            background: #fff;
            color: #606266;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">政务知识库智能问答</div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
        <button class="clear-btn" id="clearBtn">清空对话</button>
        <input type="text" id="questionInput" placeholder="请输入您的问题，按回车发送">
        <button id="sendBtn">发送</button>
    </div>

    <script src="common.js"></script>
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const inputEl = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        // 追加消息
        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const contentEl = document.createElement('div');
            contentEl.className = 'content';
            contentEl.textContent = content;
            bubble.appendChild(contentEl);
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        // 渲染来源片段
        function renderSources(bubbleEl, sources) {
            if (!sources || sources.length === 0) return;
            const sourcesDiv = document.createElement('div');
            sourcesDiv.className = 'sources';
            sourcesDiv.innerHTML = '<div style="font-weight: 600; margin-bottom: 8px;">引用来源</div>';
            sources.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'source-item';
                itemDiv.innerHTML = `
                    <div>${index + 1}. ${item.content}</div>
                    <div class="source-score">相似度：${(item.score * 100).toFixed(1)}%</div>
                `;
                sourcesDiv.appendChild(itemDiv);
            });
            bubbleEl.appendChild(sourcesDiv);
        }

        // 发送问题
        async function sendQuestion() {
            const question = inputEl.value.trim();
            if (!question) return;

            appendMessage('user', question);
            inputEl.value = '';
            sendBtn.disabled = true;

            const aiBubble = appendMessage('ai', '');
            const contentEl = aiBubble.querySelector('.content');
            let fullText = '';

            streamRequest('/qa/stream', { question }, {
                onContent: (delta) => {
                    fullText += delta;
                    contentEl.textContent = fullText;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                },
                onSources: (sources) => {
                    renderSources(aiBubble, sources);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                },
                onDone: () => {
                    sendBtn.disabled = false;
                },
                onError: (msg) => {
                    contentEl.textContent = `请求失败：${msg}`;
                    sendBtn.disabled = false;
                }
            });
        }

        // 事件绑定
        sendBtn.addEventListener('click', sendQuestion);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendQuestion();
        });
        clearBtn.addEventListener('click', () => {
            chatContainer.innerHTML = '';
        });
    </script>
</body>
</html>
