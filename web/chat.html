<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政务知识库问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 16px 24px;
            background: #fff;
            border-bottom: 1px solid #e4e7ed;
            font-size: 18px;
            font-weight: 600;
            color: #303133;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .message {
            margin-bottom: 20px;
            display: flex;
        }
        .message.user { justify-content: flex-end; }
        .message.ai { justify-content: flex-start; }
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.user .bubble {
            background: #409eff;
            color: #fff;
        }
        .message.ai .bubble {
            background: #fff;
            color: #303133;
            border: 1px solid #e4e7ed;
        }
        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #dcdfe6;
            font-size: 13px;
            color: #606266;
        }
        .source-item {
            margin-bottom: 8px;
            padding: 8px;
            background: #f5f7fa;
            border-radius: 4px;
        }
        .source-score {
            font-size: 12px;
            color: #909399;
            margin-top: 4px;
        }
        .input-area {
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #e4e7ed;
            display: flex;
            gap: 12px;
        }
        #questionInput {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        #questionInput:focus { border-color: #409eff; }
        #sendBtn {
            padding: 0 20px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #sendBtn:disabled {
            background: #a0cfff;
            cursor: not-allowed;
        }
        .clear-btn {
            padding: 0 16px;
            background: #fff;
            color: #606266;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">政务知识库智能问答</div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
        <button class="clear-btn" id="clearBtn">清空对话</button>
        <input type="text" id="questionInput" placeholder="请输入您的问题，按回车发送">
        <button id="sendBtn">发送</button>
    </div>

    <script src="common.js"></script>
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const inputEl = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        // 配置项
        const STREAM_API = '/api/qa/stream';
        const DEFAULT_COLLECTION = 'gov_policy_base';

        // 追加消息
        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const contentEl = document.createElement('div');
            contentEl.innerText = content;
            bubble.appendChild(contentEl);
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return contentEl;
        }

        // 发送流式问答请求
        async function sendMessage() {
            const question = inputEl.value.trim();
            if (!question) return;

            // 渲染用户消息
            appendMessage('user', question);
            inputEl.value = '';
            sendBtn.disabled = true;
            inputEl.disabled = true;

            // 渲染AI消息容器
            const aiContentEl = appendMessage('assistant', '');
            let fullText = '';
            let buffer = '';

            try {
                const res = await fetch(STREAM_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        collection_name: DEFAULT_COLLECTION
                    })
                });

                if (!res.ok) throw new Error('请求失败，状态码：' + res.status);

                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const events = buffer.split('\n\n');
                    buffer = events.pop(); // 保留不完整事件块，解决流式粘包问题

                    for (const eventStr of events) {
                        if (!eventStr.trim()) continue;

                        const lines = eventStr.split('\n');
                        let eventType = 'message';
                        let eventData = '';

                        for (const line of lines) {
                            if (line.startsWith('event: ')) {
                                eventType = line.slice(7);
                            } else if (line.startsWith('data: ')) {
                                eventData = line.slice(6);
                            }
                        }

                        switch (eventType) {
                            case 'content':
                                fullText += eventData;
                                aiContentEl.innerText = fullText;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                                break;
                            case 'sources':
                                // 引用来源追加在回答末尾
                                const sources = JSON.parse(eventData);
                                const sourceDiv = document.createElement('div');
                                sourceDiv.style.marginTop = '10px';
                                sourceDiv.style.fontSize = '12px';
                                sourceDiv.style.color = '#666';
                                sourceDiv.innerText = '📄 引用来源：' + sources.length + '条';
                                aiContentEl.parentNode.appendChild(sourceDiv);
                                break;
                            case 'done':
                                break;
                            case 'error':
                                throw new Error(eventData || '流式响应异常');
                        }
                    }
                }
            } catch (err) {
                aiContentEl.innerText = '请求出错：' + err.message;
            } finally {
                sendBtn.disabled = false;
                inputEl.disabled = false;
                inputEl.focus();
            }
        }

        // 清空对话
        function clearChat() {
            chatContainer.innerHTML = '';
        }

        // 绑定交互事件
        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', clearChat);
        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
